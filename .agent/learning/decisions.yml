- id: DECISION-030
  status: APPROVED
  selection: Update all the docs
  topic: Teacher and student input (supersedes DECISION-005)
  decision: >-
    The teacher receives the router payload and may also research with web search; Laya receives only the payload.
    Known risk: Laya learns to copy picks that may rest on facts it does not see.
  source: USER_DECISION
  evidence: >-
    Asked whether to rewrite the same-input rule in all three docs, keep it, or log the teacher's research into the
