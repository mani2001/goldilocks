  status: APPROVED
  selection: "why arent the current decisions such as d4 ? show that they are superseded ?"
  topic: Marking superseded and amended decisions
  decision: >-
    A replaced decision gets status SUPERSEDED and a superseded_by field naming the new decision. A partly changed
    decision keeps status APPROVED and gets an amended_by field. Entries are never deleted or renumbered. This
    extends the original ledger schema, which only used status APPROVED.
  source: USER_DECISION
  evidence: DECISION-004, 005 and 027 marked SUPERSEDED and DECISION-029 marked amended_by on 2026-11-17.
