  selection: Recorded in README.md
  topic: Teacher model
  decision: >-
    GPT-6.1 Sol through a local Codex API at high reasoning effort. Do not silently substitute direct OpenAI API
    billing or Codex CLI. Superseded by DECISION-029.
  source: USER_DECISION
  evidence: README.md and docs/PLAN.md at commit f4fcdad.
  originating_task: 2026-11-16 Pi MVP planning consolidation
  explicit_user_feedback: false

- id: DECISION-005
  status: SUPERSEDED
  superseded_by: DECISION-030
  selection: Recorded in README.md
  topic: Teacher and student input
  decision: >-
    The teacher and Laya receive exactly the same router payload: no extra teacher browsing, repository access,
