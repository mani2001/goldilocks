- id: DECISION-006
  status: APPROVED
  selection: Recorded in README.md
  topic: Execution provider
  decision: >-
    Execution models come from Nebius Token Factory, using the configured API key and available catalogue.
    Teacher access stays separate from execution-provider access.
  source: USER_DECISION
  evidence: README.md and docs/PLAN.md at commit f4fcdad.
  originating_task: 2026-11-16 Pi MVP planning consolidation
  explicit_user_feedback: false

- id: DECISION-007
  status: APPROVED
  selection: Recorded in README.md
  topic: Decision model
  decision: >-
    The decision model is a fine-tuned Laya (convaiinnovations/laya-typed-decisions), an encoder that ranks
    candidates rather than generating answers.
  source: USER_DECISION
  evidence: README.md at commit f4fcdad.
  originating_task: 2026-11-16 Pi MVP planning consolidation
  explicit_user_feedback: false

- id: DECISION-008
  status: APPROVED
  selection: Recorded in README.md
  topic: Preferences
  decision: >-
    Preferences are only quality and cost, each rated 1 to 5. Keep configuration small; no broad configuration
    framework. Proposed convention, wording still to be confirmed: higher quality means more emphasis on
    capability; higher cost means more emphasis on saving money.
  source: USER_DECISION
  evidence: README.md and docs/DESIGN.md at commit f4fcdad.
  originating_task: 2026-11-16 Pi MVP planning consolidation
  explicit_user_feedback: false

- id: DECISION-009
  status: APPROVED
  selection: Recorded in docs/DESIGN.md
  topic: Hard constraints
  decision: >-
    Picks and alternatives must satisfy hard constraints (availability, context length, modality). Code validates
    candidate identifiers and constraints; the router does not.
  source: USER_DECISION
  evidence: README.md and docs/DESIGN.md at commit f4fcdad.
  originating_task: 2026-11-16 Pi MVP planning consolidation
  explicit_user_feedback: false

- id: DECISION-010
  status: APPROVED
  selection: Recorded in docs/DESIGN.md
  topic: Router output
  decision: >-
    Output a pick, ordered alternatives, confidence with an accurate calibration status, provider, input/output
    token prices with currency and unit, and latency where known. Unknown measurements stay unknown. Provider,
    price and latency come from the evidence, not from the router.
  source: USER_DECISION
  evidence: README.md and docs/DESIGN.md at commit f4fcdad.
  originating_task: 2026-11-16 Pi MVP planning consolidation
  explicit_user_feedback: false

- id: DECISION-011
  status: APPROVED
  selection: Recorded in docs/DESIGN.md
  topic: Evidence gathering
  decision: >-
    The execution or parent model follows a skill to gather Artificial Analysis and Vals evidence through Tavily:
    Search to find sources, Extract for known pages. Provider catalogue and prices come from Token Factory's
    official sources.
  source: USER_DECISION
  evidence: README.md and docs/DESIGN.md at commit f4fcdad.
  originating_task: 2026-11-16 Pi MVP planning consolidation
  explicit_user_feedback: false

- id: DECISION-012
  status: APPROVED
  selection: Recorded in docs/DESIGN.md
  topic: Evidence cache
  decision: >-
    One local cache shared by conversations and subagents. Default TTL 24 hours, configurable. Plugin code checks
    freshness. Coalesce concurrent refreshes, validate before replacing atomically, keep the last good snapshot on
    failure and show its age. No public GitHub benchmark mirror and no scheduled central CI data feed.
  source: USER_DECISION
  evidence: docs/DESIGN.md at commit f4fcdad.
  originating_task: 2026-11-16 Pi MVP planning consolidation
  explicit_user_feedback: false

- id: DECISION-013
  status: APPROVED
  selection: Recorded in docs/DESIGN.md
  topic: Conversation bootstrap and subagents
  decision: >-
    At conversation start a default model may gather evidence before selection; ordinary task answering starts on
    the selected model. For subagents the parent gathers evidence before spawning. Never silently switch a running
    subagent's model.
  source: USER_DECISION
  evidence: docs/DESIGN.md at commit f4fcdad.
  originating_task: 2026-11-16 Pi MVP planning consolidation
  explicit_user_feedback: false

- id: DECISION-014
  status: APPROVED
  selection: Recorded in docs/DESIGN.md
  topic: Untrusted fetched content
  decision: >-
    Fetched page content is untrusted evidence. Keep it out of executable instructions and validate the structured
    values. Do not send private task text in benchmark-discovery queries.
  source: USER_DECISION
  evidence: docs/DESIGN.md at commit f4fcdad.
  originating_task: 2026-11-16 Pi MVP planning consolidation
  explicit_user_feedback: false

- id: DECISION-015
  status: APPROVED
  selection: Recorded in docs/DESIGN.md
  topic: Router failure fallback
  decision: >-
    If the router is unavailable, times out or errors, continue visibly on the native Pi default as-is and log the
    fallback. Goldilocks does not validate that default against its constraints.
  source: USER_DECISION
  evidence: README.md and docs/DESIGN.md at commit f4fcdad.
  originating_task: 2026-11-16 Pi MVP planning consolidation
  explicit_user_feedback: false

- id: DECISION-016
  status: APPROVED
  selection: Recorded in docs/DESIGN.md
  topic: Empty eligible pool
  decision: >-
    An empty eligible pool returns no selection and reports the blocking constraints. Do not invoke the native
    fallback.
  source: USER_DECISION
  evidence: README.md and docs/DESIGN.md at commit f4fcdad.
  originating_task: 2026-11-16 Pi MVP planning consolidation
  explicit_user_feedback: false

- id: DECISION-017
  status: APPROVED
  selection: Recorded in docs/DESIGN.md
  topic: Malformed router output
  decision: >-
    One repair attempt within the same deadline, then the native fallback. Never apply an unvalidated pick.
  source: USER_DECISION
  evidence: docs/DESIGN.md at commit f4fcdad.
  originating_task: 2026-11-16 Pi MVP planning consolidation
  explicit_user_feedback: false

- id: DECISION-018
  status: APPROVED
  selection: Recorded in docs/DESIGN.md
  topic: Router timeout
  decision: >-
    Configurable 60-second router timeout, including the repair attempt; validate against real teacher latency.
    Evidence refresh has its own bounded deadline.
  source: USER_DECISION
  evidence: docs/DESIGN.md at commit f4fcdad.
  originating_task: 2026-11-16 Pi MVP planning consolidation
  explicit_user_feedback: false

- id: DECISION-019
  status: APPROVED
  selection: Recorded in docs/DESIGN.md
  topic: Metadata logging
  decision: >-
    Every attempt and fallback writes local metadata logs. No raw prompts, instructions, outputs or transcripts.
    No remote telemetry.
  source: USER_DECISION
  evidence: docs/DESIGN.md at commit f4fcdad.
  originating_task: 2026-11-16 Pi MVP planning consolidation
  explicit_user_feedback: false

- id: DECISION-020
  status: APPROVED
  selection: Recorded in docs/DESIGN.md
  topic: Training capture
  decision: >-
    Training capture is explicit opt-in only. Record the exact router input plus teacher output, not whole sessions.
    Never commit private task data or API keys.
  source: USER_DECISION
  evidence: docs/DESIGN.md and docs/PLAN.md at commit f4fcdad.
  originating_task: 2026-11-16 Pi MVP planning consolidation
  explicit_user_feedback: false

- id: DECISION-021
  status: APPROVED
  selection: Recorded in docs/DESIGN.md
  topic: Confidence target
  decision: >-
    Laya's confidence means the probability of agreeing with the teacher, not of task success. Calibrate after hard
    filtering on held-out data. Do not invent a calibrated score for the teacher.
  source: USER_DECISION
  evidence: docs/DESIGN.md at commit f4fcdad.
  originating_task: 2026-11-16 Pi MVP planning consolidation
  explicit_user_feedback: false

- id: DECISION-022
  status: APPROVED
  selection: Recorded in docs/PLAN.md
  topic: Training data source
  decision: >-
    LLMRouterBench is the bulk prompt source for train, validation and test, subject to licence checks. The old
    custom 100-task set is excluded. Plugin examples are added only after their use is explicitly designed.
  source: USER_DECISION
  evidence: docs/PLAN.md at commit f4fcdad.
  originating_task: 2026-11-16 Pi MVP planning consolidation
  explicit_user_feedback: false

- id: DECISION-023
  status: APPROVED
  selection: Recorded in docs/PLAN.md
  topic: Preventing memorisation
  decision: >-
    Hide or randomise model identities, shuffle candidate pools and use counterfactual price examples. Freeze
    grouped data splits before fitting.
  source: USER_DECISION
  evidence: docs/PLAN.md at commit f4fcdad.
  originating_task: 2026-11-16 Pi MVP planning consolidation
  explicit_user_feedback: false

- id: DECISION-024
  status: APPROVED
  selection: Recorded in docs/PLAN.md
  topic: Price-variation validation
  decision: >-
    Required. Vary prices with the task fixed and compare Laya and a code-based scorer against fresh teacher
    choices. Zero hard-constraint violations, and zero strictly-higher-cost picks in dominance cases.
  source: USER_DECISION
  evidence: docs/PLAN.md section 4 at commit f4fcdad.
  originating_task: 2026-11-16 Pi MVP planning consolidation
  explicit_user_feedback: false

