schema_version: 1
decisions:
- id: DECISION-001
  status: APPROVED
  selection: Recorded in README.md
  topic: Product scope
  decision: >-
    Goldilocks selects the model for a conversation or subagent task from the opening instructions, the
    available models and the preferences. It applies the pick automatically and keeps that model for the rest
    of the conversation or task, including later turns, tool calls and compaction.
  source: USER_DECISION
  evidence: README.md and docs/DESIGN.md at commit f4fcdad.
  originating_task: 2026-11-16 Pi MVP planning consolidation
  explicit_user_feedback: false

- id: DECISION-002
  status: APPROVED
  selection: Recorded in README.md
  topic: First harness
  decision: Pi is the first harness, supporting both conversation starts and subagent starts.
  source: USER_DECISION
  evidence: README.md at commit f4fcdad.
  originating_task: 2026-11-16 Pi MVP planning consolidation
  explicit_user_feedback: false

- id: DECISION-003
  status: APPROVED
  selection: Recorded in README.md
  topic: Build order
  decision: >-
    Build inside out. Make the plugin work with the teacher as its router first, then replace the teacher with
    a local decision model behind the same router contract.
  source: USER_DECISION
  evidence: README.md and docs/PLAN.md at commit f4fcdad.
  originating_task: 2026-11-16 Pi MVP planning consolidation
  explicit_user_feedback: false

