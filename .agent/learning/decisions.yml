  selection: "update readme, create a claude.md and symlink to agetns.md"
  topic: Source of truth and agent instructions (supersedes DECISION-027)
  decision: >-
    The source of truth is README.md, docs/DESIGN.md, docs/PLAN.md and this decisions ledger; a newer ledger entry
