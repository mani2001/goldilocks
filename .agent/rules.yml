---
schema_version: 1
rules:
- id: AGENT-001
  title: Work through pull requests
  strength: MUST
  scope: All changes to this repository
  rule: >-
    Never push directly to main. Work on a branch and open a pull request that uses
    .github/pull_request_template.md.
  rationale: Every change to the plan or code gets reviewed by the other collaborator.
  source:
    type: USER_DECISION
    references:
    - ".agent/learning/decisions.yml#DECISION-032"
  enforcement:
    status: review-only
    mechanism: Review. GitHub branch protection on main is not yet enabled.
    limitations: Nothing stops a direct push until branch protection is on.
  documentation: AGENTS.md

- id: AGENT-002
  title: Use Conventional Commits
  strength: MUST
  scope: Commit messages and pull request titles
  rule: Write commit messages and pull request titles as type(scope) summary, following Conventional Commits.
  rationale: Consistent, scannable history.
  source:
    type: USER_DECISION
    references:
    - ".agent/learning/decisions.yml#DECISION-032"
  enforcement:
    status: review-only
    mechanism: Review.
    limitations: No commit-message linter is installed.
  documentation: AGENTS.md

- id: AGENT-003
  title: Record approved decisions in the ledger
  strength: MUST
  scope: Scope, design, plan, tool or model choices and working rules
  rule: >-
    When the user explicitly approves such a change, add the next DECISION-NNN to .agent/learning/decisions.yml
    and update README.md, docs/DESIGN.md or docs/PLAN.md in the same change. A decision is also how a candidate is
    resolved: when the user decides on a CANDIDATE-NNN (see AGENT-004), record the decision, set the candidate status
    and decision_id, and for ADOPT or ADAPT add the rule to .agent/rules.yml citing that decision. Mark replaced
    decisions SUPERSEDED with superseded_by, and partly changed ones with amended_by.
  rationale: Keeps one traceable history of what was decided and why.
  source:
    type: USER_DECISION
    references:
    - ".agent/learning/decisions.yml#DECISION-032"
  enforcement:
    status: review-only
    mechanism: Review of the PR Decisions section.
    limitations: Cannot detect an approval that was never recorded.
  documentation: AGENTS.md

- id: AGENT-004
  title: Propose rules only through candidates
  strength: MUST
  scope: Agent-proposed rules and guidance
  rule: >-
    After a meaningful task, review it for a lesson a rule would capture: a user correction, a breakage, a repeated
    mistake, or a code smell. If found, add CANDIDATE-NNN to .agent/learning/candidates.yml with status
    NEEDS_DECISION, proposed_rule (the rule as it would read), evidence (a nonempty list of what happened), reason
    (why the rule helps), affected_files, originating_task, confidence (HIGH, MEDIUM or LOW), suggested_enforcement
    (a check, test, lint or review), explicit_user_feedback (true if the user said it) and conflicts (rule ids it
    contradicts, or an empty list). Tell the user about it and do not follow it as a rule yet. Only explicit user
    approval, recorded as a decision (AGENT-003), promotes a candidate into this registry. Routine work, one-off
    preferences and open plan questions are not candidates.
  rationale: Prevents agent preference or repetition from becoming policy.
  source:
    type: USER_DECISION
    references:
    - ".agent/learning/decisions.yml#DECISION-034"
  enforcement:
    status: review-only
    mechanism: Review that every rule cites an APPROVED decision.
    limitations: None automated.
  documentation: AGENTS.md
