---
schema_version: 1
rules:
- id: AGENT-001
  title: Work through pull requests
  strength: MUST
  scope: All changes to this repository
  rule: >-
    Never push directly to main. Work on a branch and open a pull request that uses
    .github/pull_request_template.md.
  rationale: Every change to the plan or code gets reviewed by the other collaborator.
  source:
    type: USER_DECISION
    references:
    - ".agent/learning/decisions.yml#DECISION-032"
  enforcement:
    status: review-only
    mechanism: Review. GitHub branch protection on main is not yet enabled.
    limitations: Nothing stops a direct push until branch protection is on.
  documentation: AGENTS.md

- id: AGENT-002
  title: Use Conventional Commits
  strength: MUST
  scope: Commit messages and pull request titles
  rule: Write commit messages and pull request titles as type(scope) summary, following Conventional Commits.
  rationale: Consistent, scannable history.
  source:
    type: USER_DECISION
    references:
    - ".agent/learning/decisions.yml#DECISION-032"
  enforcement:
    status: review-only
    mechanism: Review.
    limitations: No commit-message linter is installed.
  documentation: AGENTS.md

- id: AGENT-003
  title: Record approved decisions in the ledger
  strength: MUST
  scope: Scope, design, plan, tool or model choices and working rules
  rule: >-
    When the user explicitly approves such a change, add the next DECISION-NNN to .agent/learning/decisions.yml
    and update README.md, docs/DESIGN.md or docs/PLAN.md in the same change.
  rationale: Keeps one traceable history of what was decided and why.
  source:
    type: USER_DECISION
    references:
    - ".agent/learning/decisions.yml#DECISION-032"
  enforcement:
    status: review-only
    mechanism: Review of the PR Decisions section.
    limitations: Cannot detect an approval that was never recorded.
  documentation: AGENTS.md

- id: AGENT-004
  title: Propose rules only through candidates
  strength: MUST
  scope: Agent-proposed rules and guidance
  rule: >-
    Agents add proposed rules to .agent/learning/candidates.yml. Only explicit user approval, recorded as a decision,
    promotes a candidate into this registry.
  rationale: Prevents agent preference or repetition from becoming policy.
  source:
    type: USER_DECISION
    references:
    - ".agent/learning/decisions.yml#DECISION-034"
  enforcement:
    status: review-only
    mechanism: Review that every rule cites an APPROVED decision.
    limitations: None automated.
  documentation: AGENTS.md
